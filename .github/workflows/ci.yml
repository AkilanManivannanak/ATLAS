name: ci
on:
  push:
  pull_request:
jobs:
  workflows:
    # Guard: exactly one Pages deployment workflow (pages.yml). GitHub's starter
    # "Deploy Next.js site to Pages" workflow cannot build this repo (the app lives in frontend/
    # and needs the API), so fail loudly with instructions if it is ever re-added.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Only pages.yml may deploy to GitHub Pages
        run: |
          bad=$(grep -lE "uses: *actions/deploy-pages" .github/workflows/*.y*ml | grep -v "/pages.yml$" || true)
          if [ -n "$bad" ]; then
            echo "::error::Extra Pages workflow(s): $bad. Delete them; pages.yml already deploys the results explorer."
            exit 1
          fi
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-lock.txt ruff && pip install --no-deps -e .
      - run: ruff check src tests
      - run: pytest -q
      - name: Smoke benchmark (every row must replay exactly)
        run: python -m atlas.benchmark --preset smoke --out /tmp/bench
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -t atlas-sigma-api:ci .
      - name: Build web image
        run: docker build -t atlas-sigma-web:ci ./frontend
      - name: API container answers health check
        run: |
          docker run -d --name api -p 8000:8000 -e ATLAS_DEMO_RUNS=0 atlas-sigma-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health && exit 0; sleep 2; done
          docker logs api; exit 1
